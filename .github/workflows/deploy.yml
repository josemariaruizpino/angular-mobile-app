name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages mediante GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola ejecución simultánea
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular PWA para GitHub Pages
        run: |
          npx ng build --configuration production --base-href=/${{ github.event.repository.name }}/
          cp dist/angular-mobile-app/browser/index.html dist/angular-mobile-app/browser/404.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/angular-mobile-app/browser'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
