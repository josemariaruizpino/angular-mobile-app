<div class="mobile-container home-container">
  <app-back-link link="/games" target="los juegos" />

  <!-- Cabecera: el título y el acceso directo a cada formato -->
  <header class="home-head">
    <h1 class="home-title">Elige tu <br />formato</h1>
    <p class="home-lede">
      Planes de banquillo In/Out contra cada rival, para Pauper, Modern, Standard y Pioneer. Elige formato y abre tu mazo.
    </p>
  </header>

  <!-- Dos accesos grandes: lo primero que se toca en un torneo -->
  <nav class="format-launch" aria-label="Elegir formato">
    @for (format of formats; track format.id) {
      <button
        type="button"
        [class]="'launch-btn launch-' + format.id"
        (click)="navigateToFormat(format.id)"
        [attr.aria-label]="'Ir al metagame de ' + format.label"
      >
        <span class="launch-name">{{ format.label }}</span>
        <span class="launch-count tabular-nums">{{ sideboardService.formatCounts()[format.id] }} mazos</span>
        <app-icon name="chevron-right" [size]="22" class="launch-arrow" />
      </button>
    }
  </nav>
